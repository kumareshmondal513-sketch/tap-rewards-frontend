<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Tap-to-Earn Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #18222d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            text-align: center;
        }

        .header {
            padding: 20px;
            background-color: #212d3b;
            border-bottom: 1px solid #2b394a;
        }

        .balance-container {
            margin-top: 10px;
        }

        .balance-title {
            font-size: 14px;
            color: #8e9ca8;
        }

        .balance-value {
            font-size: 36px;
            font-weight: bold;
            color: #f39c12;
            margin-top: 5px;
        }

        .tap-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .tap-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, #f39c12 0%, #d35400 100%);
            border: 8px solid #f1c40f;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.4);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 64px;
            user-select: none;
            transition: transform 0.1s ease;
        }

        .tap-button:active {
            transform: scale(0.95);
        }

        .stats {
            margin-top: 30px;
            width: 100%;
            max-width: 300px;
        }

        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background-color: #2b394a;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 8px;
        }

        .energy-bar-fill {
            height: 100%;
            width: 100%;
            background-color: #2ecc71;
            transition: width 0.2s ease;
        }

        .energy-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #8e9ca8;
        }

        .navbar {
            display: flex;
            justify-content: space-around;
            background-color: #212d3b;
            padding: 12px 0;
            border-top: 1px solid #2b394a;
        }

        .nav-item {
            color: #8e9ca8;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-item.active {
            color: #3498db;
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Tap to Earn</h2>
        <div class="balance-container">
            <div class="balance-title">মোট ব্যালেন্স</div>
            <div class="balance-value" id="balance">0</div>
        </div>
    </div>

    <div class="tap-area">
        <div class="tap-button" id="tapBtn">🪙</div>
        
        <div class="stats">
            <div class="energy-text">
                <span>⚡ এনার্জি</span>
                <span id="energyText">1000 / 1000</span>
            </div>
            <div class="energy-bar-bg">
                <div class="energy-bar-fill" id="energyFill"></div>
            </div>
        </div>
    </div>

    <div class="navbar">
        <a href="#" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">⚡</span>
            <span>Earn</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>Tasks</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">👥</span>
            <span>Team</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">👛</span>
            <span>Wallet</span>
        </a>
    </div>

    <script>
        let balance = 0;
        let energy = 1000;
        const maxEnergy = 1000;

        const balanceEl = document.getElementById('balance');
        const energyTextEl = document.getElementById('energyText');
        const energyFillEl = document.getElementById('energyFill');
        const tapBtn = document.getElementById('tapBtn');

        // Telegram WebApp Initialization
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        tapBtn.addEventListener('click', () => {
            if (energy > 0) {
                balance += 1;
                energy -= 1;
                updateUI();
            }
        });

        function updateUI() {
            balanceEl.textContent = balance;
            energyTextEl.textContent = `${energy} / ${maxEnergy}`;
            const energyPercent = (energy / maxEnergy) * 100;
            energyFillEl.style.width = `${energyPercent}%`;
        }

        // Energy Regeneration
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 1);
                updateUI();
            }
        }, 3000);
    </script>
</body>
  </html>
